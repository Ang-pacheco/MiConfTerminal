#tamaño de fuente
font_size 16.0
#opacacidad de fondo
background_opacity 0.9

#un stiker en la terminal

window_logo_path none
window_logo_position bottom-right
window_logo_alpha 0.5
window_logo_scale 0

#sonido de campana
enable_audio_bell no

#borde de arriba de la terminal
hide_window_decorations titlebar-only


window_border_width 10px
draw_minimal_borders yes 
	
#dimenciones de la terminal
initial_window_width 1800
initial_window_height 600
remmember_window_size yes
remember_window_position yes

#separacion de ventanas
window_padding_width 10

scrollback_pager_history_size 15

###paginas de terminal

tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''
#tab_title_template              "  {index}:{f'{title[:6]}…{title[-6:]}' if title.rindex(title[-1]) + 1 > 25 else title}{' []' if layout_name == 'stack' else ''} "
active_tab_title_template       "  {index}:{f'{title[:6]}…{title[-6:]}' if title.rindex(title[-1]) + 1 > 25 else title}{' []' if layout_name == 'stack' else ''} "



#tab_bar_edge bottom
#tab_bar_style powerline
#tab_powerline_style round

###animacion del cursor
cursor_trail 600
cursor_trail_decay 0.2 0.7
cursor_trail_start_threshold 3


# BEGIN_KITTY_FONTS
font_family      family="Noto Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

